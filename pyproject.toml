[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-relations"
version = "0.1.0"
description = "Independent neural search for matter-gravity KK overlap relations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "torch>=2.3", "matplotlib>=3.8", "threadpoolctl>=3.2"]

[project.scripts]
neural-search = "main:main"

[tool.setuptools]
py-modules = ["main", "model", "train", "physics", "validation", "plot_tool", "utils"]

[tool.setuptools.data-files]
"share/neural-relations" = ["config.json"]
